<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Dockyard</title>
  <desc id="description">A local-first visual runtime for Docker</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DDE5E0" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCFCFC" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FCFCFC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FCFCFC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FCFCFC"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0E7A43"/>

  <!-- Logo mark -->
  <g transform="translate(100 112) scale(1.75)">
    <rect width="64" height="64" rx="16" fill="#0E7A43"/>
    <path d="M14 25h11v10H14V25Zm13 0h11v10H27V25Zm13 0h11v10H40V25Z" fill="#DDF2E5"/>
    <path d="M20.5 13h11v10h-11V13Zm13 0h11v10h-11V13Z" fill="#FFFFFF"/>
    <path d="M9.5 37h45l-2.2 5.7A14.1 14.1 0 0 1 39.1 52H25.4A16.1 16.1 0 0 1 9.5 38.4V37Z" fill="#FFFFFF"/>
    <path d="M16 44c3.2 2.1 6.4 2.1 9.6 0s6.4-2.1 9.6 0 6.4 2.1 9.6 0" fill="none" stroke="#0E7A43" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="96" y="318" fill="#0F1A14" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="100" font-weight="700" letter-spacing="-3">Dockyard</text>
  <text x="100" y="384" fill="#24302A" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="34" font-weight="500">A local-first visual runtime</text>
  <text x="100" y="428" fill="#24302A" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="34" font-weight="500">for Docker and AGENTS.md</text>
  <g font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0E7A43">
    <rect x="100" y="476" width="166" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="183" y="505" text-anchor="middle">Runs locally</text>
    <rect x="280" y="476" width="150" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="355" y="505" text-anchor="middle">Live logs</text>
    <rect x="444" y="476" width="168" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="528" y="505" text-anchor="middle">No telemetry</text>
  </g>

  <!-- Mini product mock: containers view -->
  <g transform="translate(690 120)">
    <rect x="0" y="0" width="440" height="390" rx="14" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
    <path d="M14 0H426A14 14 0 0 1 440 14V44H0V14A14 14 0 0 1 14 0Z" fill="#F5F8F6"/>
    <line x1="0" y1="44" x2="440" y2="44" stroke="#DDE5E0" stroke-width="2"/>
    <circle cx="24" cy="22" r="6" fill="#D5DDD8"/><circle cx="44" cy="22" r="6" fill="#D5DDD8"/><circle cx="64" cy="22" r="6" fill="#D5DDD8"/>
    <rect x="150" y="11" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#DDE5E0"/>
    <text x="245" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B7A71">localhost:41739</text>

    <!-- Stat tiles -->
    <g font-family="DM Sans, sans-serif">
      <rect x="20" y="62" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
      <text x="34" y="86" font-size="13" fill="#6B7A71">Running</text>
      <text x="34" y="117" font-size="28" font-weight="700" fill="#0F1A14">4</text>
      <rect x="158" y="62" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
      <text x="172" y="86" font-size="13" fill="#6B7A71">Images</text>
      <text x="172" y="117" font-size="28" font-weight="700" fill="#0F1A14">19</text>
      <rect x="296" y="62" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
      <text x="310" y="86" font-size="13" fill="#6B7A71">Disk used</text>
      <text x="310" y="117" font-size="28" font-weight="700" fill="#0F1A14">16.4 GB</text>
    </g>

    <!-- Container table -->
    <rect x="20" y="150" width="400" height="220" rx="8" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
    <path d="M28 151H412A7 7 0 0 1 419 158V184H21V158A7 7 0 0 1 28 151Z" fill="#F5F8F6"/>
    <line x1="20" y1="184" x2="420" y2="184" stroke="#DDE5E0" stroke-width="2"/>
    <g font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#6B7A71" letter-spacing="1">
      <text x="36" y="172">NAME</text>
      <text x="196" y="172">STATE</text>
      <text x="300" y="172">CPU</text>
    </g>
    <g font-family="DM Sans, sans-serif" font-size="15" font-weight="600" fill="#0F1A14">
      <text x="36" y="214">shop-web-1</text>
      <text x="36" y="260">shop-api-1</text>
      <text x="36" y="306">shop-db-1</text>
      <text x="36" y="352">shop-worker-1</text>
    </g>
    <line x1="20" y1="230" x2="420" y2="230" stroke="#DDE5E0" stroke-width="1.5"/>
    <line x1="20" y1="276" x2="420" y2="276" stroke="#DDE5E0" stroke-width="1.5"/>
    <line x1="20" y1="322" x2="420" y2="322" stroke="#DDE5E0" stroke-width="1.5"/>
    <g font-family="DM Sans, sans-serif" font-size="12" font-weight="700">
      <rect x="190" y="196" width="84" height="24" rx="12" fill="#0E7A43" fill-opacity="0.1"/>
      <circle cx="204" cy="208" r="4" fill="#0E7A43"/><text x="214" y="212" fill="#0E7A43">running</text>
      <rect x="190" y="242" width="84" height="24" rx="12" fill="#0E7A43" fill-opacity="0.1"/>
      <circle cx="204" cy="254" r="4" fill="#0E7A43"/><text x="214" y="258" fill="#0E7A43">running</text>
      <rect x="190" y="288" width="84" height="24" rx="12" fill="#0E7A43" fill-opacity="0.1"/>
      <circle cx="204" cy="300" r="4" fill="#0E7A43"/><text x="214" y="304" fill="#0E7A43">running</text>
      <rect x="190" y="334" width="74" height="24" rx="12" fill="#6B7A71" fill-opacity="0.12"/>
      <circle cx="204" cy="346" r="4" fill="#6B7A71"/><text x="214" y="350" fill="#6B7A71">exited</text>
    </g>
    <g>
      <rect x="300" y="205" width="100" height="7" rx="3.5" fill="#F5F8F6" stroke="#DDE5E0"/>
      <rect x="300" y="205" width="22" height="7" rx="3.5" fill="#0E7A43"/>
      <rect x="300" y="251" width="100" height="7" rx="3.5" fill="#F5F8F6" stroke="#DDE5E0"/>
      <rect x="300" y="251" width="64" height="7" rx="3.5" fill="#0E7A43"/>
      <rect x="300" y="297" width="100" height="7" rx="3.5" fill="#F5F8F6" stroke="#DDE5E0"/>
      <rect x="300" y="297" width="36" height="7" rx="3.5" fill="#0E7A43"/>
      <rect x="300" y="343" width="100" height="7" rx="3.5" fill="#F5F8F6" stroke="#DDE5E0"/>
    </g>
  </g>
  <text x="100" y="584" fill="#6B7A71" font-family="JetBrains Mono, monospace" font-size="20">dockyard.piyushdoorwar.com</text>
</svg>
