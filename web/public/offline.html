<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E7A43" />
    <meta name="color-scheme" content="light dark" />
    <title>Dockyard is unavailable</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; color: #253029; background: #fcfcfc; }
      @media (prefers-color-scheme: dark) { body { color: #d9dbde; background: #161719; } h1 { color: #f3f4f5; } }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; color: #0f1a14; }
      p { line-height: 1.5; }
      a { display: inline-block; border-radius: .5rem; padding: .75rem 1rem; color: white; background: #0E7A43; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Dockyard is unavailable</h1>
      <p>Start the Dockyard container, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
